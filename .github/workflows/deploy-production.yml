name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    
    - name: Install backend dependencies
      run: |
        cd backend
        npm ci --production
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run backend tests
      run: |
        cd backend
        npm test
    
    - name: Run frontend tests
      run: |
        cd frontend
        npm test
    
    - name: Build frontend
      run: |
        cd frontend
        npm run build
    
    - name: Create deployment archive
      run: |
        cd backend
        tar -czf ../backend-release.tar.gz --exclude=node_modules --exclude=dist --exclude=.env .
        cd ../frontend
        tar -czf ../frontend-release.tar.gz dist
    
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
    
    - name: Configure SSH known hosts
      run: |
        mkdir -p ~/.ssh
        printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts
    
    - name: Deploy to VPS
      run: |
        VPS_HOST="${{ secrets.VPS_HOST }}"
        VPS_USER="${{ secrets.VPS_USER }}"
        DEPLOY_SITE="qms"
        RELEASE_SHA="${{ github.sha }}"
        
        # Create release directory on VPS
        ssh "$VPS_USER@$VPS_HOST" "mkdir -p /home/deploy/incoming/$DEPLOY_SITE/$RELEASE_SHA"
        
        # Upload archives
        scp backend-release.tar.gz "$VPS_USER@$VPS_HOST:/home/deploy/incoming/$DEPLOY_SITE/$RELEASE_SHA/backend.tar.gz"
        scp frontend-release.tar.gz "$VPS_USER@$VPS_HOST:/home/deploy/incoming/$DEPLOY_SITE/$RELEASE_SHA/frontend.tar.gz"
        
        # Trigger deployment via wrapper
        ssh "$VPS_USER@$VPS_HOST" "sudo /usr/local/sbin/vps-deploy $DEPLOY_SITE $RELEASE_SHA"
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
    
    - name: Health check
      run: |
        curl -f https://quotation.josongeri.co.ke/health || exit 1
        curl -f https://quotation.josongeri.co.ke/ || exit 1
    
    - name: Smoke tests
      run: |
        curl -f https://quotation.josongeri.co.ke/api/health
        curl -f https://quotation.josongeri.co.ke/api-docs