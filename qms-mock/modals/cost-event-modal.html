<div class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">Add Cost Event</div>
            <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">Event Type</label>
                <select class="form-select">
                    <option>Actual Cost</option>
                    <option>Substitution</option>
                    <option>Addition</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Quote Item</label>
                <select class="form-select">
                    <option>Select quote item...</option>
                    <option>Custom illuminated logo signage</option>
                    <option>3D acrylic lettering</option>
                    <option>Installation labour</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Description</label>
                <input type="text" class="form-input" placeholder="Enter description">
            </div>
            <div class="form-group">
                <label class="form-label">Quantity</label>
                <input type="number" class="form-input" placeholder="1">
            </div>
            <div class="form-group">
                <label class="form-label">Unit Amount</label>
                <input type="text" class="form-input" placeholder="KES 0.00">
            </div>
            <div class="form-group">
                <label class="form-label">Supplier</label>
                <select class="form-select">
                    <option>Select supplier...</option>
                    <option>ABC Signs</option>
                    <option>XYZ Metal Works</option>
                    <option>LED Solutions Ltd</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Invoice Reference</label>
                <input type="text" class="form-input" placeholder="INV-XXX">
            </div>
            <div class="form-group">
                <label class="form-label">Reason (for substitution/addition)</label>
                <textarea class="form-textarea" placeholder="Enter reason..."></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary">Cancel</button>
            <button class="btn btn-primary">Add Cost Event</button>
        </div>
    </div>
</div>
