<div class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">Create New Quote</div>
            <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">Client</label>
                <select class="form-select">
                    <option>Select a client...</option>
                    <option>Acme Creative Studio</option>
                    <option>TechCorp Kenya</option>
                    <option>GreenLeaf Restaurant</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Quote Title</label>
                <input type="text" class="form-input" placeholder="Enter quote title">
            </div>
            <div class="form-group">
                <label class="form-label">Template</label>
                <select class="form-select">
                    <option>Standard Quote v3</option>
                    <option>Simple Quote v1</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Currency</label>
                <select class="form-select">
                    <option>KES - Kenyan Shilling</option>
                    <option>USD - US Dollar</option>
                    <option>EUR - Euro</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Valid Until</label>
                <input type="date" class="form-input">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary">Cancel</button>
            <button class="btn btn-primary">Create Quote</button>
        </div>
    </div>
</div>
