<div class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">Item Details</div>
            <button class="modal-close">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">Description</label>
                <input type="text" class="form-input" value="Custom illuminated logo signage" readonly>
            </div>
            <div class="form-group">
                <label class="form-label">Quantity</label>
                <input type="number" class="form-input" value="1" readonly>
            </div>
            <div class="form-group">
                <label class="form-label">Unit</label>
                <input type="text" class="form-input" value="each" readonly>
            </div>
            <div class="form-group">
                <label class="form-label">Selected Supplier Offer</label>
                <select class="form-select">
                    <option>ABC Signs - KES 10,500 (5 days)</option>
                    <option>XYZ Metal - KES 11,000 (2 days)</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Cost Snapshot</label>
                <input type="text" class="form-input" value="KES 10,500" readonly>
            </div>
            <div class="form-group">
                <label class="form-label">Pricing Rule</label>
                <select class="form-select">
                    <option>Percentage markup (19.05%)</option>
                    <option>Fixed markup</option>
                    <option>Margin target</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Sell Price</label>
                <input type="text" class="form-input" value="KES 12,500" readonly>
            </div>
            <div class="form-group">
                <label class="form-label">Override Reason</label>
                <textarea class="form-textarea" placeholder="Enter reason for price override..."></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary">Cancel</button>
            <button class="btn btn-primary">Save Changes</button>
        </div>
    </div>
</div>
